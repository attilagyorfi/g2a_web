<!doctype html>
<html lang="hu">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5" />
    <title>G2A Marketing – Adatvezérelt Marketing Ügynökség</title>
    <meta name="description" content="G2A Marketing – Adatvezérelt marketing ügynökség. SEO, Google Ads, Meta hirdetések, webfejlesztés, közösségi média és stratégiai marketing szolgáltatások." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1a1a1a" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="hu_HU" />
    <meta property="og:site_name" content="G2A Marketing" />
    <meta property="og:title" content="G2A Marketing – Adatvezérelt Marketing Ügynökség" />
    <meta property="og:description" content="Adatvezérelt marketing ügynökség. SEO, Google Ads, Meta hirdetések, webfejlesztés és stratégiai marketing." />
    <meta property="og:url" content="https://g2amarketing.hu" />
    <!-- Default OG image — overridden client-side by SeoHead with a per-page
         title-baked card (via Cloudinary text-overlay transforms). Social
         crawlers that don't run JS at least see this default. -->
    <meta property="og:image" content="https://res.cloudinary.com/dzh1unb6d/image/upload/w_1200,h_630,c_pad,b_rgb:0a0a0a,q_auto,f_auto/g2a/og/default-logo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="G2A Marketing logó" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="G2A Marketing – Adatvezérelt Marketing Ügynökség" />
    <meta name="twitter:description" content="Adatvezérelt marketing ügynökség. SEO, Google Ads, Meta hirdetések, webfejlesztés és stratégiai marketing." />
    <meta name="twitter:image" content="https://res.cloudinary.com/dzh1unb6d/image/upload/w_1200,h_630,c_pad,b_rgb:0a0a0a,q_auto,f_auto/g2a/og/default-logo.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://g2amarketing.hu" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- RSS feed — feed readers, podcast clients, and LLM crawlers auto-discover this -->
    <link rel="alternate" type="application/rss+xml" title="G2A Marketing – Blog" href="https://g2amarketing.hu/rss.xml" />

    <!-- Pre-hydration theme set: prevents flash of wrong theme on page load.
         Reads "g2a-theme" from localStorage and applies the matching class to
         <html> before React mounts. Defaults to "dark" if nothing stored. -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem("g2a-theme");
          var theme = (stored === "light" || stored === "dark") ? stored : "dark";
          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <!-- Google Fonts: Geist (sans + mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet" />

    <!-- Cloudinary CDN — every featured image, OG card, logo comes from here.
         Preconnect cuts the TLS handshake out of the critical render path. -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!-- Google Tag Manager – ID az admin Beállítások oldalon konfigurálható -->
    <!-- GTM_PLACEHOLDER_START -->
    <!-- GTM_PLACEHOLDER_END -->

    <!-- JSON-LD Organization Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MarketingAgency",
      "name": "G2A Marketing",
      "url": "https://g2amarketing.hu",
      "logo": "https://g2amarketing.hu/wp-content/uploads/2022/06/g2a_512x512_transparent_feher.png",
      "description": "Adatvezérelt marketing ügynökség – SEO, Google Ads, Meta hirdetések, webfejlesztés, közösségi média és stratégiai marketing.",
      "telephone": "+36301902575",
      "email": "info@g2amarketing.hu",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "HU"
      },
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
        "opens": "08:00",
        "closes": "17:00"
      },
      "sameAs": [
        "https://www.facebook.com/g2amarketing",
        "https://www.linkedin.com/company/g2a-marketing/"
      ],
      "serviceType": [
        "SEO",
        "Google Ads",
        "Meta Hirdetések",
        "Webfejlesztés",
        "Közösségi Média Marketing",
        "Stratégiai Marketing",
        "Lokalizáció",
        "Arculattervezés"
      ]
    }
    </script>
  </head>

  <body>
    <!-- Google Tag Manager (noscript) -->
    <!-- GTM_NOSCRIPT_PLACEHOLDER_START -->
    <!-- GTM_NOSCRIPT_PLACEHOLDER_END -->

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Analytics (Umami / Plausible) is injected at runtime by ThirdPartyScripts.tsx
         only when VITE_ANALYTICS_ENDPOINT is configured. This avoids requesting a
         literal "%VITE_ANALYTICS_ENDPOINT%/umami" URL when the env var is empty. -->
  </body>

</html>
